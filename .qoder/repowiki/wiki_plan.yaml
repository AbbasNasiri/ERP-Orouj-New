version: 1

repowiki:
  notes:
    - text: "تنها مرجع پول، موتور بک‌اند electron/pricing.js است. estimateCost در src/smart.js فقط پیش‌نویس رابط است و تا یکپارچگی، marginPercent را اشتباهاً روی مواد هم اعمال می‌کند. هیچ‌وقت برآورد رابط را قیمت قطعی معرفی نکنید."
    - text: "صدای فارسی در خود برنامه پیاده نشده است: هیچ مسیر میکروفونی در رابط وجود ندارد. ابزار سنجش آفلاین در tests/voice و موتور محلی ONNX در tools/voice-asr ساخته و آفلاین‌سنجی شده‌اند، اما دقتشان با صدای واقعی چاپخانه هنوز اندازه‌گیری نشده است. docs/offline-voice-fa.md و docs/voice-corpus-fa.md پژوهش و پروتکل‌اند، نه قابلیت آماده. سند وضعیت را مبنای «انجام‌شده» قرار ندهید."
    - text: "رکورد با وضعیت queued یعنی «در صف ارسال داخلی». اتصال واقعی پیامک (خط 10000001296) و ابلاغ به مشتری یا همکار بیرونی پیاده و اجرا نشده است."
    - text: "اختیار شروع و شروع مجدد تولید فقط با نقش مدیر چاپخانه است؛ هر واحد عملیاتی می‌تواند توقف فوری را بدون تأیید مدیر ثبت کند؛ تسویهٔ سفارش لغوشده با مدیر مالی است. این قواعد در بک‌اند اعتبارسنجی می‌شوند، نه فقط در دکمه‌های رابط."
    - text: "موادِ آوردهٔ مشتری customerSupplied دارند: مبلغ فروش صفر، ولی consumedQty برای کاردکس حفظ می‌شود. سود فقط بر خدمات اعمال می‌شود، هرگز دوباره بر مواد."
    - text: "چاپ افست تا ۵۰۰۰ برگ یک بلوک کامل محاسبه می‌شود؛ بالاتر از یک بلوک، فراخوان باید mode صریح proportional یا ceilBlocks بدهد و موتور به‌جای حدس زدن خطا می‌دهد."
    - text: "سفارش‌های قدیمی عمداً مهاجرت خودکار نشده‌اند. داشتن وضعیت قدیمی «تأیید شده» مجوز تولید نیست و نباید مصنوعی صادر شود."
    - text: "نرخ‌های نمونه، دادهٔ کاربرند با تاریخ‌اند و تأییدِ بازار یا مقررات مالیاتی نیستند. وظیفهٔ زمان‌بندی‌شدهٔ بازبینی شنبه‌ها هنوز ساخته نشده و هیچ تغییر خودکار نرخ مجاز نیست."
    - text: "ذخیره‌سازی SQLite با better-sqlite3 و نوشتن «کل یک مجموعه در یک فراخوان» است؛ برای شبکهٔ سه‌سیستمه، مرجع دادهٔ سرویس مرکزی هنوز تصمیم نشده است. اشتراک فایل زندهٔ JSON/SQLite راه‌حل پیش‌فرض نیست."
    - text: "مثال مرجع پذیرش: کتاب ۴۰۰ صفحه رحلی دورنگ، تیراژ ۲۰۰۰، جمع ۱٬۰۳۹٬۵۰۰٬۰۰۰ تومان، با سود ۲۰٪ روی خدمات ۱٬۲۴۷٬۴۰۰٬۰۰۰ تومان. تغییر این عدد بدون تصمیم مالک، باگ است."
    - text: "اعتبارسنجی: npm test مجموعهٔ node --test tests/*.test.cjs را اجرا می‌کند؛ اسکریپت‌های .qoder/skills/printshop-voice-intake/scripts/intake-probe.mjs و .qoder/skills/printshop-pricing/scripts/check-pricing.cjs رفتار مسیر دریافت سفارش و قواعد قیمت را جدا می‌سنجند."
    - text: "رابط کاملاً فارسی و راست‌به‌چپ با فونت Vazirmatn است؛ زبان مستندات مرجع فارسی است و اعداد در رابط با جداکنندهٔ هزارگان فارسی نمایش داده می‌شوند."

knowledgecard:
  notes:
    - text: "مرز ماژول‌ها را این‌گونه بشناسید: دریافت سفارش (src/smart.js، src/smartorder.js، CustomerRequestForm.jsx، CustomerEligibility.jsx)؛ قیمت‌گذاری (electron/pricing.js، electron/quote.js، src/QuoteEditor.jsx، src/quote-money.mjs، src/FinancialDocuments.jsx)؛ گردش کار (electron/workflow.js، src/workflow.jsx، src/Workbench.jsx)؛ امنیت و بک‌اند (electron/backend.js، electron/main.js، electron/preload.js)؛ انبار و واحدها (src/units.js، src/inventorysmart.js، src/suppliers.js)؛ نامه‌ها (src/letters.js)؛ بازاریابی (src/marketing.js)."
    - text: "src/App.jsx با بیش از چهار هزار خط، شل رابط و کارتابل‌هاست و چند پنل را در یک فایل نگه می‌دارد؛ آن را یک ماژول بزرگ بدانید، نه توابع پراکنده. استایل‌ها در *.css کنار همان پنل‌ها هستند."
    - text: "پوشهٔ tests/ مرجع رفتار مورد انتظار است (از جمله tests/intake-offline.test.cjs برای عدد گفتاری و متن درخواست مشتری)؛ پوشهٔ .work دادهٔ آزمایشی موقت است و بخشی از محصول نیست."
    - text: "dist/، build/ و release/ خروجی‌اند. PrintShop.exe موجود در release قدیمی‌تر از تغییرات مشتری، قیمت و گردش کار است؛ آن را نسخهٔ حاوی تغییرات فعلی فرض نکنید."
    - text: "اسناد docs/requirements-fa.md (تصمیم‌های کسب‌وکار و پرسش‌های باز OPEN-01 تا OPEN-11)، docs/roadmap-fa.md (ترتیب مراحل و معیار عبور) و docs/implementation-status-fa.md (مرز کد اضافه‌شده و قابلیت آماده) منبع حقیقت‌اند و بر حدس از کد اولویت دارند."
    - text: "README-fa.md راهنمای اجرای پروژه است، نه سند نیازمندی. در صورت تعارض، requirements-fa.md ملاک است."
